UR3eReach-v1:                                            
  env_wrapper:                                           
     - sb3_contrib.common.wrappers.TimeFeatureWrapper:   
         max_steps: 100                                  
     #- rl_zoo3.wrappers.ActionNoiseWrapper              
                                                         
  n_timesteps: !!float 2e5                               
  batch_size: 512                                        
  gamma: 0.95                                            
  n_steps: 1024                                          
  learning_rate: 0.0004216602866170854                   
  ent_coef: 3.535061333312276e-08                        
  clip_range: 0.4                                        
  n_epochs: 10                                           
  gae_lambda: 0.95                                       
  max_grad_norm: 0.7                                     
  vf_coef: 0.6450399819437715                            
  policy: 'MultiInputPolicy'                             
  policy_kwargs: "dict(                                  
    activation_fn= nn.Tanh,                              
    net_arch=[ dict(pi=[512, 512], vf=[512, 512]) ]      
    )"                                                               
                                                                               

